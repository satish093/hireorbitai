<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ho-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ho-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="128" height="128" rx="28" fill="url(#ho-grad)"/>

  <!-- Orbit ring -->
  <ellipse cx="64" cy="68" rx="44" ry="20"
           transform="rotate(-22 64 68)"
           fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.9"/>

  <!-- Planet body -->
  <circle cx="64" cy="68" r="18" fill="#ffffff"/>
  <circle cx="64" cy="68" r="18" fill="url(#ho-grad)" opacity="0.30"/>

  <!-- AI sparks -->
  <g fill="#ffffff" opacity="0.95">
    <path d="M96 34 l1.8 4.5 4.5 1.8 -4.5 1.8 -1.8 4.5 -1.8 -4.5 -4.5 -1.8 4.5 -1.8z"/>
    <circle cx="104" cy="26" r="1.6"/>
    <circle cx="22"  cy="38" r="1.4"/>
    <circle cx="106" cy="96" r="1.4"/>
  </g>

  <!-- Bottom rule -->
  <rect x="20" y="114" width="88" height="2" rx="1" fill="url(#ho-rule)"/>
</svg>
