<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="tb-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- "T" + "B" composed monogram -->
  <g fill="url(#tb-grad)">
    <!-- T (vertical bar + crossbar) -->
    <rect x="22" y="22" width="54" height="14" rx="2"/>
    <rect x="42" y="22" width="14" height="84" rx="2"/>
    <!-- B (vertical bar + two stacked half-circles) -->
    <rect x="58" y="22" width="14" height="84" rx="2"/>
    <path d="M72 22 h6 a22 22 0 0 1 0 44 h-6 z"/>
    <path d="M72 62 h8 a22 22 0 0 1 0 44 h-8 z"/>
  </g>

  <!-- Bridge silhouette across the centre of the mark -->
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M30 78 Q64 60 98 78"/>
    <!-- towers -->
    <line x1="44" y1="64" x2="44" y2="84"/>
    <line x1="84" y1="64" x2="84" y2="84"/>
    <!-- suspenders -->
    <line x1="50" y1="70" x2="50" y2="78"/>
    <line x1="58" y1="68" x2="58" y2="77"/>
    <line x1="66" y1="68" x2="66" y2="77"/>
    <line x1="74" y1="69" x2="74" y2="77"/>
    <line x1="78" y1="70" x2="78" y2="78"/>
  </g>

  <!-- Small AI spark -->
  <g fill="#ffffff" opacity="0.95">
    <path d="M92 40 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z"/>
    <circle cx="100" cy="34" r="1.3"/>
    <circle cx="88" cy="32" r="1"/>
  </g>

  <!-- Bottom rule -->
  <rect x="20" y="114" width="88" height="2" rx="1" fill="url(#tb-rule)"/>
</svg>
