name: Deploy to dev

# Mirrors deploy-production.yml but targets the `dev` branch, a separate
# PM2 process (hireorbitai-dev), and a separate CloudPanel site
# (dev.yourdomain.com on port 3001).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEV_DEPLOY_HOST     — same VPS IP / hostname as production
#   DEV_DEPLOY_USER     — same SSH user (or a separate one)
#   DEV_DEPLOY_PORT     — SSH port (typically 22)
#   DEV_DEPLOY_SSH_KEY  — same private key works; add a dedicated key for separation
#   DEV_DOMAIN          — e.g. dev.hireorbitai.com  (used in smoke test URLs)
#
# The dev site user's home directory must contain a ~/hireorbitai-dev clone
# checked out on the `dev` branch, with its own backend/.env pointing at the
# dev database and PORT=3001.

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Disabled — remove this input to re-enable'
        required: true

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Push to VPS (dev) + run update-dev.sh
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://${{ secrets.DEV_DOMAIN }}

    steps:
      - name: Verify secrets are configured
        run: |
          for var in DEV_DEPLOY_HOST DEV_DEPLOY_USER DEV_DEPLOY_PORT DEV_DEPLOY_SSH_KEY DEV_DOMAIN; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              echo "Configure it at Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PORT: ${{ secrets.DEV_DEPLOY_PORT }}
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_DOMAIN: ${{ secrets.DEV_DOMAIN }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ${{ secrets.DEV_DEPLOY_USER }}
          key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEV_DEPLOY_PORT }}
          command_timeout: 10m
          script_stop: true
          debug: true
          script: |
            set -euo pipefail
            cd ~/hireorbitai-dev
            echo "→ deploying dev commit ${{ github.sha }} (triggered by ${{ github.actor }})"
            WEBROOT="$HOME/htdocs/${{ secrets.DEV_DOMAIN }}" \
            PM2_NAME="hireorbitai-dev" \
            SMOKE_URL="https://${{ secrets.DEV_DOMAIN }}/api/health" \
            DEV_ROOT="$HOME/hireorbitai-dev" \
            bash scripts/update-dev.sh

      - name: Post-deploy smoke test
        run: |
          set -e
          BASE="https://${{ secrets.DEV_DOMAIN }}"

          curl -fsS "$BASE/api/health" | tee /tmp/health-dev.json
          grep -q '"ok":true' /tmp/health-dev.json || { echo "::error::health did not report ok=true"; exit 1; }

          AUTH_STATUS=$(curl -o /dev/null -w '%{http_code}' -s "$BASE/api/auth/me")
          [ "$AUTH_STATUS" = "401" ] || { echo "::error::/auth/me returned $AUTH_STATUS, expected 401"; exit 1; }

          FRONT_STATUS=$(curl -o /dev/null -w '%{http_code}' -s "$BASE/")
          [ "$FRONT_STATUS" = "200" ] || { echo "::error::frontend returned $FRONT_STATUS, expected 200"; exit 1; }
        env:
          DEV_DOMAIN: ${{ secrets.DEV_DOMAIN }}
