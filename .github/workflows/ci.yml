name: CI

on:
  push:
    branches: [main, dev, dev2]
  pull_request:
    branches: [main, dev, dev2]

# Cancel superseded runs on the same branch / PR — saves Actions minutes
# when someone pushes twice in a row.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Install at the root to populate the @hireorbitai/shared workspace
      # symlink + build the shared package before either half touches it.
      - run: npm ci
      - run: npm run shared:build
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend run build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run shared:build
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
