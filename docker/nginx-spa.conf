server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — any unknown path returns index.html so React Router can take over.
  location / {
    try_files $uri /index.html;
  }

  # Long-cache hashed assets emitted by Vite.
  location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico|mp4|webm)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Entry HTML — never cache so a new bundle is picked up on the next load.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Security headers (minimal). The CloudPanel-native Nginx adds more in front.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options        "DENY"   always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
