# =============================================================================
# HireOrbit AI — local development stack.
#
# Spins up Postgres + the API in one shot. The frontend is OPTIONAL here —
# most contributors run it with `npm run dev` against this stack so they get
# HMR. To run the production frontend too, uncomment the `frontend` service.
#
# Usage:
#   cd docker
#   cp .env.example .env       # then fill in secrets
#   docker compose up -d
#   docker compose logs -f api
#
# Stop + wipe:
#   docker compose down -v
#
# Notes:
#   - Volumes are named so they survive `down` without `-v`.
#   - The API mounts the repo's `database/` so you can apply SQL with:
#       docker compose exec db psql -U hireorbitai -d hireorbitai \
#         -f /sql/schema.sql
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireorbitai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-hireorbitai}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database:/sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hireorbitai} -d ${POSTGRES_DB:-hireorbitai}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: '0'
      DATABASE_URL: postgres://${POSTGRES_USER:-hireorbitai}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-hireorbitai}
      DATABASE_SSL: disable
      UPLOADS_DIR: /var/lib/hireorbitai/uploads
      STORAGE_URL_SECRET: ${STORAGE_URL_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@hireorbitai.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-HireOrbit AI}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - uploads:/var/lib/hireorbitai/uploads
    ports:
      - '4000:4000'

  # Production-style frontend bundle. Uncomment if you want to test the built
  # SPA locally; otherwise stick to `npm run dev` against the api service.
  #
  # frontend:
  #   build:
  #     context: ..
  #     dockerfile: docker/frontend.Dockerfile
  #     args:
  #       VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
  #   depends_on:
  #     - api
  #   ports:
  #     - "8080:80"

volumes:
  pgdata:
  uploads:
